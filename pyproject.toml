[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ieesbots-governance"
version = "1.0.0"
description = "Deterministic governance core for synthetic multimodal multi-agent care navigation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kyaw Kyaw Oo", email = "kyaw.tech@gmail.com" }]
keywords = [
    "multi-agent",
    "ai-governance",
    "ai-safety",
    "healthcare",
    "phi-redaction",
    "audit",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
live = ["crewai", "langchain", "langchain-community", "ollama"]

[project.scripts]
ieesbots = "ieesbots.cli:main"

[tool.setuptools.packages.find]
include = ["ieesbots*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --ignore=test"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ieesbots"]
branch = true
omit = []

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"
